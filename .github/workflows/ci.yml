name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2e + accessibility (axe). Visual-regression baselines are captured on macOS and
      # are platform-specific, so they are not asserted on this Linux runner — pixel diffs
      # here would be font-rendering noise, not real regressions. To gate visuals in CI,
      # capture baselines inside this same container (or the official Playwright image).
      - name: E2e & a11y
        run: npx playwright test filters a11y

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails the PR if it changes shipped code without recording a changeset.
      - name: Require a changeset
        run: npx changeset status --since=origin/main
